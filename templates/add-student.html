<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #fce7f3, #dbeafe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .form-container {
            background: white;
            width: 100%;
            max-width: 550px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(79, 70, 229, 0.15);
            border: 1px solid #c7d2fe;
        }

        .form-container h1 {
            text-align: center;
            color: #4338ca;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background-color: #f8fafc;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(110deg, #4338ca, #7c3aed, #db2777);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #4f46e5;
            font-weight: bold;
        }

        .back-link:hover {
            color: #db2777;
        }

        @media (max-width: 500px) {
            .form-container {
                padding: 25px 20px;
            }
        }

    </style>
</head>

<body>

    <div class="form-container">

        <h1>Add New Student</h1>

        <p class="subtitle">
            Enter student details below
        </p>

        <form action="/students/add" method="POST">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name"
                       placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age"
                       placeholder="Enter age" min="18" max="30" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Marks</label>
                <input type="number" name="marks"
                       placeholder="Enter marks" required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course"
                       placeholder="Enter course name" required>
            </div>

            <div class="form-group">
                <label>Student Image URL</label>
                <input type="text" name="image"
                       placeholder="Enter image URL" required>
            </div>

            <div class="form-group">
                <label>Attendance Status</label>
                <select name="status" required>
                    <option value="1">Present</option>
                    <option value="0">Absent</option>
                </select>
            </div>

            <button type="submit">+ Add Student</button>

        </form>

        <a href="/" class="back-link">← Back to Students Directory</a>

    </div>

</body>
</html>
