
<!DOCTYPE html>
<html>
<head>
    <title>View Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            min-height: 100vh;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: 20px auto;
        }

        .student-card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #172554;
            font-size: 28px;
            margin-bottom: 25px;
        }

        h3 {
            text-align: center;
            color: #2563eb;
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: capitalize;
        }

        .student-image {
            display: block;
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #dbeafe;
            margin: 0 auto 25px;
        }

        .details {
            background: #f8fafc;
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 9px;
            border-left: 4px solid #2563eb;
            font-size: 16px;
            transition: 0.3s;
        }

        .details:hover {
            background: #eff6ff;
            transform: translateX(4px);
        }

        .details strong {
            color: #172554;
        }

        .back-btn {
            display: block;
            width: fit-content;
            margin: 25px auto 0;
            padding: 12px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            .student-card {
                padding: 22px;
            }

            h2 {
                font-size: 24px;
            }
        }body {
    background: linear-gradient(135deg, #ede9fe, #dbeafe);
    min-height: 100vh;
    padding: 40px 20px;
    color: #1e1b4b;
}

.student-card {
    background: #ecadd6;
    padding: 40px;
    border-radius: 22px;
    max-width: 750px;
    margin: auto;
    box-shadow: 0 12px 35px rgba(76, 29, 149, 0.15);
}

h2 {
    text-align: center;
    color: #083d58;
    font-size: 34px;
    margin-bottom: 25px;
}

h3 {
    text-align: center;
    color: #083d58;
    font-size: 26px;
    margin-bottom: 25px;
    text-transform: capitalize;
}

/* Bigger student image */
.student-image {
    display: block;
    width: 230px;
    height: 230px;
    object-fit: cover;
    border-radius: 20px;
    border: 6px solid #c4b5fd;
    margin: 0 auto 30px;
    box-shadow: 0 8px 20px rgba(91, 33, 182, 0.2);
}

.details {
    background: #f5f3ff;
    padding: 17px 20px;
    margin-bottom: 14px;
    border-radius: 10px;
    border-left: 5px solid #8b5cf6;
    font-size: 17px;
    transition: 0.3s;
}

.details:hover {
    background: #ede9fe;
    transform: translateX(5px);
}

.details strong {
    color: #5b21b6;
}

.back-btn {
    display: block;
    width: fit-content;
    margin: 28px auto 0;
    padding: 14px 30px;
    background: #d61717;
    color: rgb(248, 238, 238);
    text-decoration: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s;
}

.back-btn:hover {
    background: #d61717;
    transform: translateY(-3px);
}
    </style>
</head>

<body>

<div class="container">
    <div class="student-card">

        <h2>Student Details</h2>

        <h3>{{ std[1] }}</h3>

        <img src="{{ std[6] }}" class="student-image">

        <div class="details">
            <strong>ID:</strong> {{ std[0] }}
        </div>

        <div class="details">
            <strong>Name:</strong> {{ std[1] }}
        </div>

        <div class="details">
            <strong>Age:</strong> {{ std[2] }}
        </div>

        <div class="details">
            <strong>Gender:</strong> {{ std[3] }}
        </div>

        <div class="details">
            <strong>Marks:</strong> {{ std[4] }}
        </div>

        <div class="details">
            <strong>Course:</strong> {{ std[5] }}
        </div>

        <div class="details">
            <strong>Status:</strong> {{ std[7] }}
        </div>

        <a href="/" class="back-btn">← Back to Home</a>

    </div>
</div>

</body>
</html>
