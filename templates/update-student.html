
<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #f3e8ff, #fce7f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(147, 112, 219, 0.15);
            border: 1px solid #f0e6ff;
        }

        h2 {
            text-align: center;
            color: #9b7bc5;
            margin-bottom: 28px;
            font-size: 27px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #8b79a9;
            font-weight: 600;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #e2d5f5;
            border-radius: 9px;
            font-size: 15px;
            color: #71628c;
            background: #faf8ff;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #c4a7ed;
            background: #ffffff;
            box-shadow: 0 0 8px rgba(196, 167, 237, 0.3);
        }

        input::placeholder {
            color: #c2b5d6;
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #c4a7ed, #a9c8f5);
            color: #ffffff;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #b393e4, #91b9ed);
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(169, 200, 245, 0.4);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #a58bc9;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .back:hover {
            color: #829ed5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Update Student Details</h2>

    <form action="/students/update/{{ std[0] }}" method="post">

        <label>Name</label>
        <input type="text" name="name"
               value="{{ std[1] }}" required>

        <label>Age</label>
        <input type="number" name="age"
               value="{{ std[2] }}" min="18" max="30" required>

        <label>Gender</label>
        <input type="text" name="gender"
               value="{{ std[3] }}" required>

        <label>Marks</label>
        <input type="number" name="marks"
               value="{{ std[4] }}" required>

        <label>Course</label>
        <input type="text" name="course"
               value="{{ std[5] }}" required>

        <label>Image</label>
        <input type="text" name="image"
               value="{{ std[6] }}">

        <label>Status (1=Present, 0=Absent)</label>
        <input type="number" name="status"
               value="{{ std[7] }}" min="0" max="1" required>

        <button type="submit">Save Changes</button>

    </form>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
