<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>
<body>

<h2>Update Student Details</h2>

<form action="/students/update/{{ std[0] }}" method="post">

    <label>Name</label>
    <input type="text" name="name"
           value="{{ std[1] }}" required>
    <br><br>

    <label>Age</label>
    <input type="number" name="age"
           value="{{ std[2] }}" min="18" max="30" required>
    <br><br>

    <label>Gender</label>
    <input type="text" name="gender"
           value="{{ std[3] }}" required>
    <br><br>

    <label>Marks</label>
    <input type="number" name="marks"
           value="{{ std[4] }}" required>
    <br><br>

    <label>Course</label>
    <input type="text" name="course"
           value="{{ std[5] }}" required>
    <br><br>

    <label>Image</label>
    <input type="text" name="image"
           value="{{ std[6] }}">
    <br><br>

    <label>Status (1=Present, 0=Absent)</label>
    <input type="number" name="status"
           value="{{ std[7] }}" min="0" max="1" required>
    <br><br>

    <button type="submit">Save Changes</button>

</form>

<a href="/">Back to home</a>

</body>
</html>
